name: WARSEED Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grey-ridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2
        with:
          version: 4.6.3
          use-dotnet: true
          include-templates: true

      - name: Resolve Godot console executable
        shell: powershell
        run: |
          $installation = Join-Path $env:USERPROFILE 'godot'
          $console = @(Get-ChildItem -LiteralPath $installation -Recurse -File -Filter 'Godot_v4.6.3-stable_mono_win64_console.exe')
          if ($console.Count -ne 1) { throw 'Expected exactly one Godot 4.6.3 Mono console executable.' }
          $version = & $console[0].FullName --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^4\.6\.3\.stable\.mono') { throw "Unexpected Godot version: $version" }
          "WARSEED_GODOT_CONSOLE=$($console[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build managed runtime
        shell: powershell
        run: |
          dotnet build WARSEED.csproj --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare export templates for isolated verification
        shell: powershell
        run: |
          $source = Join-Path $env:USERPROFILE 'AppData\Roaming\Godot\export_templates'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'artifacts\verification-profile\AppData\Roaming\Godot\export_templates'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Godot export templates were not installed.' }
          New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Recurse

      - name: Verify playable battles release
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\tools\verify_grey_ridge_release.ps1
          -GodotConsolePath "$env:WARSEED_GODOT_CONSOLE"
          -SessionId "ci-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"

      - name: Build versioned Windows package
        shell: powershell
        run: |
          $version = "ci-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME }
          .\tools\build_github_package.ps1 -Version $version -Commit $env:GITHUB_SHA

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warseed-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/github-packages/*.zip
            build/github-packages/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warseed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/control-contract/*.json
            artifacts/*report*.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: warseed-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release

      - name: Verify checksum and publish playtest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict *.sha256
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 \
            --verify-tag --target "$SOURCE_COMMIT" \
            --title "WARSEED $RELEASE_TAG (Windows playtest)" \
            --generate-notes --prerelease --latest=false
